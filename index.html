<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refurbished Produkte Vergleich</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
      <a class="navbar-brand" href="#">RefurbCompare</a>
      <form class="d-flex ms-auto">
        <input class="form-control me-2" id="productSearch" type="search" placeholder="Produkte suchen" aria-label="Suche">
        <button class="btn btn-outline-success" id="searchButton" type="button">Suche</button>
      </form>
    </div>
  </nav>

  <div class="container mt-4">
    <div id="resultContainer" class="row">
      <!-- Produkte werden hier dynamisch eingefügt -->
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
